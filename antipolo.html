<!DOCTYPE html>
<html>
<head>
  <title>Antipolo Tour</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      background: #f5eee3;
      font-family: Arial, sans-serif;
    }

    .tour-card {
      position: relative;
      width: min(100%, 900px);
      margin: 0 auto;
      overflow: hidden;
      border-radius: 24px;
    }

    .tour-card img {
      display: block;
      width: 100%;
      height: auto;
    }

    .book-tour {
      position: absolute;
      right: 24px;
      bottom: 24px;
      padding: 14px 24px;
      border-radius: 28px;
      background: #08a9c7;
      color: white;
      font-weight: bold;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .book-tour:hover {
      transform: translateY(-4px);
    }
  </style>
</head>

<body>
  <div class="tour-card">
    <img src="hinulugang taktak.png" alt="Hinulugang Taktak tour">
    <a class="book-tour" href="booking.html" target="_blank" rel="noopener">
      Book This Tour
    </a>
  </div>
<br>
  <div class="tour-card">
  <img src="pinto art museum.png" alt="Pinto Art Museum tour">
  <a class="book-tour" href="booking.html" target="_blank" rel="noopener">
    Book This Tour
  </a>
</div>
<br>
<div class="tour-card">
  <img src="antipolo cathedral.png" alt="Antipolo Cathedral tour">
  <a class="book-tour" href="booking.html" target="_blank" rel="noopener">
    Book This Tour
  </a>
</div>

</body>
</html>

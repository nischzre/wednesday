<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saan Tayo - Booking Form</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f7f6f0;
    color: #263b35;
    padding: 40px 15px;
}

.booking-container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 8px 25px #00000012;
}

.subtitle {
    color: #b47745;
    font-size: 12px;
    letter-spacing: 3px;
    font-weight: bold;
    margin-bottom: 12px;
}

h1 {
    font-family: Georgia, serif;
    font-size: 35px;
    margin-bottom: 10px;
}

.description {
    color: #777;
    margin-bottom: 30px;
}

label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 8px;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 7px;
    margin-bottom: 20px;
    font-size: 14px;
}

select[multiple] {
    height: 130px;
}

.checkbox-group {
    margin-bottom: 20px;
}

.checkbox-group label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: normal;
    margin: 12px 0;
}

.checkbox-group input {
    width: auto;
    margin: 0;
}

button {
    width: 100%;
    background: #263b35;
    color: white;
    border: none;
    padding: 15px;
    border-radius: 7px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #b47745;
}

#result {
    display: none;
    background: #edf3e9;
    padding: 20px;
    margin-top: 20px;
    border-radius: 8px;
    line-height: 1.8;
    overflow-wrap: anywhere;
}

</style>
</head>

<body>

<div class="booking-container">

    <p class="subtitle">SAAN TAYO</p>

    <h1>Travel Booking Form</h1>

    <p class="description">
        Plan your next adventure around the Philippines!
    </p>

    <!-- BOOKING FORM -->
    <form id="bookingForm">

        <!-- TEXT INPUT -->
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname"
        placeholder="Enter your full name" required>

        <!-- EMAIL INPUT -->
        <label for="email">Email Address</label>
        <input type="email" id="email"
        placeholder="example@gmail.com" required>

        <!-- MULTIPLE SELECTION -->
        <label for="destination">Choose Destinations</label>
        <select id="destination" multiple required>
            <option value="Laguna">Laguna</option>
            <option value="Manila">Manila</option>
            <option value="Batangas">Batangas</option>
            <option value="Pangasinan">Pangasinan</option>
            <option value="Tagaytay">Tagaytay</option>
        </select>

        <small style="display:block; margin-top:-12px; margin-bottom:20px; color:#777;">
            Hold Command (⌘) to select multiple destinations on Mac.
        </small>

        <!-- DATE INPUT -->
        <label for="date">Travel Date</label>
        <input type="date" id="date" required>

        <!-- TIME INPUT -->
        <label for="time">Departure Time</label>
        <input type="time" id="time" required>

        <!-- CHECKBOX INPUT -->
        <label>Travel Preferences</label>

        <div class="checkbox-group">
            <label>
                <input type="checkbox" name="preference"
                value="Beach Adventure">
                Beach Adventure
            </label>

            <label>
                <input type="checkbox" name="preference"
                value="Roadtrip">
                Roadtrip
            </label>

            <label>
                <input type="checkbox" name="preference"
                value="Nature Exploration">
                Nature Exploration
            </label>

            <label>
                <input type="checkbox" name="preference"
                value="Historical Places">
                Historical Places
            </label>
        </div>

        <!-- NUMBER OF GUESTS -->
        <label for="guests">Number of Guests</label>
        <input type="number" id="guests"
        min="1" max="20" value="1" required>

        <!-- TEXTAREA -->
        <label for="message">Additional Requests</label>
        <textarea id="message" rows="4"
        placeholder="Write your special requests here..."></textarea>

        <!-- SUBMIT BUTTON -->
        <button type="submit">
            SUBMIT BOOKING ↗
        </button>

    </form>

    <!-- BOOKING RESULT -->
    <div id="result" role="status" aria-live="polite"></div>

</div>

<script>
document.getElementById("bookingForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("fullname").value;
    const email = document.getElementById("email").value;

    const destinations = Array.from(
        document.getElementById("destination").selectedOptions
    ).map(option => option.value);

    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const guests = document.getElementById("guests").value;

    const preferences = Array.from(
        document.querySelectorAll(
            'input[name="preference"]:checked'
        )
    ).map(item => item.value);

    const message = document.getElementById("message").value;

    const result = document.getElementById("result");

    result.replaceChildren();

    function addLine(label, value) {
        const p = document.createElement("p");
        const strong = document.createElement("strong");
        strong.textContent = label + ": ";
        p.append(strong, document.createTextNode(value || "None"));
        result.appendChild(p);
    }

    const heading = document.createElement("h3");
    heading.textContent = "Booking Submitted Successfully!";
    result.appendChild(heading);

    addLine("Name", name);
    addLine("Email", email);
    addLine("Destinations", destinations.join(", "));
    addLine("Travel Date", date);
    addLine("Departure Time", time);
    addLine("Guests", guests);
    addLine("Preferences", preferences.join(", "));
    addLine("Additional Requests", message);

    const note = document.createElement("p");
    note.textContent = "Demo only: This booking is displayed on this page and is not sent to a real booking service.";
    result.appendChild(note);

    result.style.display = "block";

});
</script>

</body>
</html>
